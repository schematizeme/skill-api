# Contrato mínimo no piso da casa (schematize-api): passa em scripts/check-api.sh.
# Contract-first: este arquivo é a fonte; servidor e cliente são gerados/validados contra ele.
openapi: 3.1.0
info:
  title: Pedidos
  version: 1.0.0
  description: API de pedidos. Erros em application/problem+json (RFC 9457).
servers:
  - url: https://api.exemplo.org/v1
security:
  - oauth2: [pedidos:ler]
paths:
  /pedidos:
    get:
      operationId: listarPedidos
      summary: Lista pedidos, mais novos primeiro, com paginação por cursor.
      parameters:
        - name: cursor
          in: query
          description: Cursor opaco devolvido em `proximo`. Nunca construa um à mão.
          schema: { type: string }
        - name: limite
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: Página de pedidos.
          headers:
            RateLimit:
              description: Quota restante (draft IETF httpapi-ratelimit-headers).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [itens]
                properties:
                  itens:
                    type: array
                    items: { $ref: "#/components/schemas/Pedido" }
                  proximo:
                    type: [string, "null"]
        "429":
          $ref: "#/components/responses/LimiteExcedido"
        default:
          $ref: "#/components/responses/Erro"
    post:
      operationId: criarPedido
      summary: Cria um pedido. Reenviar com a mesma Idempotency-Key devolve o mesmo resultado.
      security:
        - oauth2: [pedidos:escrever]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única por tentativa lógica (UUID v4). Retida por 24 h.
          schema: { type: string, minLength: 16, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoNovo" }
      responses:
        "201":
          description: Criado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "409":
          description: Idempotency-Key reutilizada com corpo diferente, ou requisição original ainda em curso.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        default:
          $ref: "#/components/responses/Erro"
  /pedidos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: substituirPedido
      summary: Substitui o pedido. Exige If-Match com o ETag lido (concorrência otimista).
      security:
        - oauth2: [pedidos:escrever]
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PedidoNovo" }
      responses:
        "200":
          description: Substituído.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "412":
          description: ETag desatualizado.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problema" }
        default:
          $ref: "#/components/responses/Erro"
webhooks:
  pedidoPago:
    post:
      operationId: webhookPedidoPago
      summary: Entregue ao endpoint do cliente quando o pedido é pago (at-least-once).
      parameters:
        - name: webhook-id
          in: header
          required: true
          description: Id estável da entrega lógica; o receptor deduplica por ele.
          schema: { type: string }
        - name: webhook-timestamp
          in: header
          required: true
          description: Segundos desde a época; o receptor rejeita fora da janela (5 min).
          schema: { type: string }
        - name: webhook-signature
          in: header
          required: true
          description: "v1,<base64 HMAC-SHA256 de id.timestamp.corpo>; pode haver mais de uma (rotação)."
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pedido" }
      responses:
        "204":
          description: Recebido. Qualquer outro status dispara retry com backoff.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.exemplo.org/authorize
          tokenUrl: https://auth.exemplo.org/token
          scopes:
            pedidos:ler: Ler pedidos
            pedidos:escrever: Criar e alterar pedidos
  responses:
    Erro:
      description: Erro no formato RFC 9457.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
    LimiteExcedido:
      description: Limite de requisições excedido.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problema" }
  schemas:
    Problema:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    PedidoNovo:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { type: string }
    Pedido:
      type: object
      required: [id, estado]
      properties:
        id: { type: string }
        estado: { type: string, enum: [novo, pago, cancelado] }
