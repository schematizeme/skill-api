pt = "Contrato de API da casa: OpenAPI 3.1+ contract-first, gRPC/protobuf com buf, webhooks assinados (HMAC, replay, retry, dedupe), Idempotency-Key, erros RFC 9457, paginação por cursor, versionamento e deprecação com Sunset, rate limit e ETag. Traz gate check-api.sh."
